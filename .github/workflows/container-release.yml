# =============================================================================
# MOSS & MARROW — Container Build, Sign, and Publish to ECR
# =============================================================================
# This workflow is the ONLY place Docker images are built and published.
# It enforces the "build once, deploy digest" model.
#
# Pipeline:
#   1. Build frontend and backend images with BuildKit.
#   2. Push versioned images to Amazon ECR (requires AWS OIDC configuration).
#   3. Generate SBOM (Software Bill of Materials) using Syft.
#   4. Sign images using Cosign with GitHub OIDC (keyless signing).
#   5. Generate and attach build provenance attestations.
#   6. Output immutable image digests for the CD workflow to consume.
#
# STATUS OF AWS COMPONENTS:
#   - AWS OIDC:              Configured but awaiting AWS infrastructure.
#   - ECR push:              Configured but awaiting AWS infrastructure.
#   - Cosign signing:        Configured but awaiting ECR setup.
#   - SBOM upload to ECR:    Configured but awaiting ECR setup.
#
# Required GitHub secrets (see docs/devops/github-actions-setup.md):
#   AWS_ACCOUNT_ID           Your 12-digit AWS account ID
#   AWS_REGION               AWS region (e.g. us-east-1)
#   AWS_ECR_ROLE_ARN         IAM role ARN with ECR push permissions
#   ECR_REPOSITORY_FRONTEND  ECR repository name for frontend image
#   ECR_REPOSITORY_BACKEND   ECR repository name for backend image
#
# Triggers:
#   - Push to main (tagged release)
#   - Manual dispatch (for ad-hoc release)
#
# SECURITY: This workflow ONLY runs on main branch pushes.
# Pull requests from forks NEVER trigger this workflow.
# =============================================================================

name: Container Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual release"
        required: true
        default: "Manual release"

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false  # Never cancel an in-progress release

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB: build-and-publish
  # Builds both images, publishes to ECR, signs, generates SBOM and provenance.
  # ---------------------------------------------------------------------------
  build-and-publish:
    name: Build, Sign, and Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write   # Required for AWS OIDC and Cosign keyless signing
      attestations: write  # Required to persist provenance attestations
      packages: write   # Required for GHA cache layer access

    outputs:
      frontend-digest: ${{ steps.frontend-push.outputs.digest }}
      backend-digest: ${{ steps.backend-push.outputs.digest }}
      frontend-image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_FRONTEND }}
      backend-image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      # ------------------------------------------------------------------------
      # AWS OIDC Authentication
      # STATUS: Configured — awaiting AWS IAM OIDC provider and role setup.
      # See docs/devops/aws-oidc-setup.md for required AWS configuration.
      # ------------------------------------------------------------------------
      
      # ------------------------------------------------------------------------
      # Debug GitHub OIDC Identity
      # ------------------------------------------------------------------------
      - name: Debug GitHub OIDC identity
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Actor: $GITHUB_ACTOR"

      - name: Inspect GitHub OIDC claims safely
        run: |
          node <<'NODE'
          async function main() {
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;

            if (!requestUrl || !requestToken) {
              throw new Error("GitHub OIDC environment variables are missing.");
            }

            const url = new URL(requestUrl);
            url.searchParams.set("audience", "sts.amazonaws.com");

            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${requestToken}`
              }
            });

            if (!response.ok) {
              throw new Error(`OIDC request failed: HTTP ${response.status}`);
            }

            const result = await response.json();

            if (!result.value) {
              throw new Error("GitHub did not return an OIDC token.");
            }

            const parts = result.value.split(".");
            if (parts.length !== 3) {
              throw new Error("Invalid JWT format.");
            }

            const payload = JSON.parse(
              Buffer.from(parts[1], "base64url").toString("utf8")
            );

            for (const key of [
              "iss",
              "sub",
              "aud",
              "repository",
              "repository_id",
              "repository_owner",
              "repository_owner_id",
              "ref",
              "event_name"
            ]) {
              if (payload[key] !== undefined) {
                console.log(`${key}: ${JSON.stringify(payload[key])}`);
              }
            }
          }

          main().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

      # ------------------------------------------------------------------------
      # AWS OIDC Authentication
      # ------------------------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        id: aws-auth
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log AWS authentication result
        if: always()
        run: |
          if [ "${{ steps.aws-auth.outcome }}" = "success" ]; then
            echo "AWS OIDC authentication succeeded."
          else
            echo "AWS OIDC authentication failed."
          fi

          

      - name: Log in to Amazon ECR
        id: ecr-login
        if: steps.aws-auth.outcome == 'success'
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Validate ECR release inputs
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ECR_REPOSITORY_FRONTEND: ${{ vars.ECR_REPOSITORY_FRONTEND }}
          ECR_REPOSITORY_BACKEND: ${{ vars.ECR_REPOSITORY_BACKEND }}
        run: |
          missing=""
          [ -z "$ECR_REGISTRY" ] && missing="${missing}\n  - ECR login registry output"
          [ -z "$ECR_REPOSITORY_FRONTEND" ] && missing="${missing}\n  - vars.ECR_REPOSITORY_FRONTEND"
          [ -z "$ECR_REPOSITORY_BACKEND" ] && missing="${missing}\n  - vars.ECR_REPOSITORY_BACKEND"

          if [ -n "$missing" ]; then
            echo "ECR release configuration is incomplete:"
            echo -e "$missing"
            exit 1
          fi

      # ------------------------------------------------------------------------
      # Frontend Image — Build and Push
      # ------------------------------------------------------------------------
      - name: Build and push frontend image
        id: frontend-push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}
          build-args: VITE_API_URL=/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          # Provenance attestation captures build metadata for supply-chain verification.
          provenance: true
          sbom: true

      - name: Log frontend image digest
        run: |
          echo "Frontend image digest: ${{ steps.frontend-push.outputs.digest }}"
          echo "FRONTEND_DIGEST=${{ steps.frontend-push.outputs.digest }}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------------
      # Backend Image — Build and Push
      # ------------------------------------------------------------------------
      - name: Build and push backend image
        id: backend-push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true

      - name: Log backend image digest
        run: |
          echo "Backend image digest: ${{ steps.backend-push.outputs.digest }}"
          echo "BACKEND_DIGEST=${{ steps.backend-push.outputs.digest }}" >> "$GITHUB_ENV"

      # ------------------------------------------------------------------------
      # SBOM Generation — Syft
      # Generates a CycloneDX SBOM for each image for supply-chain compliance.
      # STATUS: SBOM generation runs locally. ECR upload requires AWS setup.
      # ------------------------------------------------------------------------
      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2

      - name: Generate SBOM — frontend image
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}
          artifact-name: sbom-frontend-${{ github.sha }}.spdx.json
          output-file: sbom-frontend.spdx.json
          format: spdx-json
          # Upload both generated files together in the dedicated step below.
          upload-artifact: false

      - name: Generate SBOM — backend image
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}:${{ github.sha }}
          artifact-name: sbom-backend-${{ github.sha }}.spdx.json
          output-file: sbom-backend.spdx.json
          format: spdx-json
          # Upload both generated files together in the dedicated step below.
          upload-artifact: false

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-frontend.spdx.json
            sbom-backend.spdx.json
          retention-days: 90

      # ------------------------------------------------------------------------
      # Image Signing — Cosign (Keyless with GitHub OIDC)
      # STATUS: Signing requires images to be published to ECR first.
      # Signing is skipped when AWS authentication is not configured.
      # ------------------------------------------------------------------------
      - name: Install Cosign
        if: steps.aws-auth.outcome == 'success'
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign frontend image with Cosign (keyless)
        if: steps.aws-auth.outcome == 'success' && steps.frontend-push.outputs.digest != ''
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ vars.ECR_REPOSITORY_FRONTEND }}"
          DIGEST="${{ steps.frontend-push.outputs.digest }}"
          cosign sign --yes "${REGISTRY}/${REPO}@${DIGEST}"
          echo "✅ Frontend image signed: ${REGISTRY}/${REPO}@${DIGEST}"

      - name: Sign backend image with Cosign (keyless)
        if: steps.aws-auth.outcome == 'success' && steps.backend-push.outputs.digest != ''
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          REPO="${{ vars.ECR_REPOSITORY_BACKEND }}"
          DIGEST="${{ steps.backend-push.outputs.digest }}"
          cosign sign --yes "${REGISTRY}/${REPO}@${DIGEST}"
          echo "✅ Backend image signed: ${REGISTRY}/${REPO}@${DIGEST}"

      # ------------------------------------------------------------------------
      # GitHub Artifact Attestation (Provenance)
      # Attaches a signed provenance attestation to each published image.
      # Links the image to this exact commit, workflow run, and repository.
      # ------------------------------------------------------------------------
      - name: Attest frontend build provenance
        if: steps.aws-auth.outcome == 'success' && steps.frontend-push.outputs.digest != ''
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v2.2.3
        with:
          subject-name: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_FRONTEND }}
          subject-digest: ${{ steps.frontend-push.outputs.digest }}
          push-to-registry: true

      - name: Attest backend build provenance
        if: steps.aws-auth.outcome == 'success' && steps.backend-push.outputs.digest != ''
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v2.2.3
        with:
          subject-name: ${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACKEND }}
          subject-digest: ${{ steps.backend-push.outputs.digest }}
          push-to-registry: true

      # ------------------------------------------------------------------------
      # Release Summary
      # ------------------------------------------------------------------------
      - name: Publish release summary
        if: always()
        run: |
          echo "## 🐳 Container Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | SHA | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend  | \`${{ github.sha }}\` | \`${{ steps.frontend-push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend   | \`${{ github.sha }}\` | \`${{ steps.backend-push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.aws-auth.outcome }}" != "success" ]; then
            echo "⚠️ **ECR push, signing, and provenance are disabled.** Configure AWS secrets to enable." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "✅ Images pushed, signed, and attested to ECR." >> "$GITHUB_STEP_SUMMARY"
          fi

