# =============================================================================
# MOSS & MARROW — Container Build, Sign, and Publish to Amazon ECR
# =============================================================================
# Pipeline:
#   1. Checkout repository
#   2. Configure AWS credentials via GitHub OIDC
#   3. Log in to Amazon ECR
#   4. Set up Docker Buildx
#   5. Build and push frontend image
#   6. Build and push backend image
#   7. Security checks (Trivy scan, SBOM, Cosign signing, provenance attestation)
#   8. Publish release summary
# =============================================================================

name: Container Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual release"
        required: true
        default: "Manual release"

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
      packages: write
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-publish:
    needs: security
    name: Build, Sign, and Publish Images
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write      # Required for AWS OIDC and Cosign keyless signing
      attestations: write  # Required to persist provenance attestations
      packages: write      # Required for GHA cache access

    outputs:
      frontend-digest: ${{ steps.frontend-push.outputs.digest }}
      backend-digest: ${{ steps.backend-push.outputs.digest }}
      frontend-image: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/frontend
      backend-image: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/backend

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 2. Configure AWS credentials using OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ECR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      # 3. Log in to Amazon ECR
      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      # 4. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 5. Build and push frontend image
      - name: Build and push frontend image
        id: frontend-push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/frontend:${{ github.sha }}
          build-args: VITE_API_URL=/api/v1
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          provenance: true
          sbom: true

      # 6. Build and push backend image
      - name: Build and push backend image
        id: backend-push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          provenance: true
          sbom: true

      # ------------------------------------------------------------------------
      # DevSecOps: Vulnerability Scanning (Trivy)
      # ------------------------------------------------------------------------
      - name: Scan frontend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/frontend@${{ steps.frontend-push.outputs.digest }}
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan backend image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/backend@${{ steps.backend-push.outputs.digest }}
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: false
          exit-code: "1"

      # ------------------------------------------------------------------------
      # DevSecOps: SBOM Generation (Syft)
      # ------------------------------------------------------------------------
      - name: Install Syft for SBOM generation
        uses: anchore/sbom-action/download-syft@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2

      - name: Generate SBOM — frontend image
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/frontend:${{ github.sha }}
          artifact-name: sbom-frontend-${{ github.sha }}.spdx.json
          output-file: sbom-frontend.spdx.json
          format: spdx-json
          upload-artifact: false

      - name: Generate SBOM — backend image
        uses: anchore/sbom-action@61119d458adab75f756bc0b9e4bde25725f86a7a # v0.17.2
        with:
          image: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/backend:${{ github.sha }}
          artifact-name: sbom-backend-${{ github.sha }}.spdx.json
          output-file: sbom-backend.spdx.json
          format: spdx-json
          upload-artifact: false

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always()
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom-frontend.spdx.json
            sbom-backend.spdx.json
          retention-days: 90

      # ------------------------------------------------------------------------
      # DevSecOps: Image Signing — Cosign (Keyless with GitHub OIDC)
      # ------------------------------------------------------------------------
      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign frontend image with Cosign
        run: |
          cosign sign --yes "${{ steps.ecr-login.outputs.registry }}/moss-marrow/frontend@${{ steps.frontend-push.outputs.digest }}"

      - name: Sign backend image with Cosign
        run: |
          cosign sign --yes "${{ steps.ecr-login.outputs.registry }}/moss-marrow/backend@${{ steps.backend-push.outputs.digest }}"

      # ------------------------------------------------------------------------
      # DevSecOps: Build Provenance Attestation
      # ------------------------------------------------------------------------
      - name: Attest frontend build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v2.2.3
        with:
          subject-name: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/frontend
          subject-digest: ${{ steps.frontend-push.outputs.digest }}
          push-to-registry: true

      - name: Attest backend build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v2.2.3
        with:
          subject-name: ${{ steps.ecr-login.outputs.registry }}/moss-marrow/backend
          subject-digest: ${{ steps.backend-push.outputs.digest }}
          push-to-registry: true

      # ------------------------------------------------------------------------
      # Summary
      # ------------------------------------------------------------------------
      - name: Record verified release
        run: |
          printf '%s\n' "${{ github.sha }}" "${{ steps.frontend-push.outputs.digest }}" "${{ steps.backend-push.outputs.digest }}" > verified-release.txt
          sha256sum scripts/deploy.sh | cut -d' ' -f1 >> verified-release.txt
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: verified-release-${{ github.run_attempt }}
          path: verified-release.txt
          if-no-files-found: error

      - name: Publish release summary
        run: |
          echo "## 🐳 Container Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Image | Digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend  | \`${{ steps.ecr-login.outputs.registry }}/moss-marrow/frontend:${{ github.sha }}\` | \`${{ steps.frontend-push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Backend   | \`${{ steps.ecr-login.outputs.registry }}/moss-marrow/backend:${{ github.sha }}\` | \`${{ steps.backend-push.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Release completed." >> "$GITHUB_STEP_SUMMARY"
