name: Rollback Production
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Successful release ID from /opt/moss-releases.json"
        required: true
        type: string
concurrency:
  group: cd-refs/heads/main
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-south-1
      RELEASE_ID: ${{ inputs.release_id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # Match existing CD pin
        with:
          persist-credentials: false
      - name: Validate selected release and prepare payload
        run: |
          set -euo pipefail
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}-[0-9]{8}T[0-9]{6}Z-[a-f0-9]{8}$ ]]
          echo "Selected release: $RELEASE_ID"
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib
          script=pathlib.Path('scripts/rollback.sh').read_bytes()
          encoded=base64.b64encode(script).decode()
          assert len(encoded)<=16384, 'Rollback script exceeds SSM payload limit'
          pathlib.Path('rollback-parameters.json').write_text(json.dumps({
              'operation':['rollback'],'releaseId':[os.environ['RELEASE_ID']],
              'deployScript':[encoded],'scriptSha256':[hashlib.sha256(script).hexdigest()]}))
          PY
      - uses: aws-actions/configure-aws-credentials@61cd5800c18cd650d23785df9484e8ff76655acf # v6, Node.js 24
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Verify destination and invoke rollback
        id: send
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == 874940900689 ]]
          id=$(aws ec2 describe-instances --instance-ids i-0ca2febefca349a25 --query 'Reservations[0].Instances[0].[InstanceId,State.Name]' --output text)
          [[ "$id" == $'i-0ca2febefca349a25\trunning' ]]
          command=$(aws ssm send-command --document-name moss-marrow-deploy \
            --instance-ids i-0ca2febefca349a25 --parameters file://rollback-parameters.json \
            --timeout-seconds 600 --query Command.CommandId --output text)
          echo "command=$command" >> "$GITHUB_OUTPUT"
      - name: Wait and report actual result
        env:
          COMMAND_ID: ${{ steps.send.outputs.command }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS+720))
          while (( SECONDS < deadline )); do
            if ! status=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0ca2febefca349a25 --query Status --output text 2>ssm-error.txt); then
              if grep -q InvocationDoesNotExist ssm-error.txt; then sleep 5; continue; fi
              cat ssm-error.txt >&2; exit 1
            fi
            case "$status" in
              Pending|InProgress|Delayed) sleep 10;;
              *)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id i-0ca2febefca349a25 --query '[StandardOutputContent,StandardErrorContent]' --output text
                [[ "$status" == Success ]] || exit 1
                echo "Verified rollback: $RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
                exit 0;;
            esac
          done
          echo 'Rollback timed out; inspect SSM status before retrying.' >&2
          exit 1
