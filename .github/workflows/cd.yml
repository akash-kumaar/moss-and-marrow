# =============================================================================
# MOSS & MARROW — Continuous Deployment to EC2 via SSM
# =============================================================================
# Deploys immutable container images from ECR to the EC2 instance using
# AWS Systems Manager Run Command.
#
# Flow:
#   1. Trigger on successful Container Release or manual dispatch
#   2. Authenticate to AWS via GitHub OIDC
#   3. Resolve immutable image digests from ECR
#   4. Send SSM Run Command with validated digests
#   5. Poll for completion with exponential backoff
# =============================================================================

name: CD — Deploy to EC2

on:
  workflow_run:
    workflows: ["Container Release"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Git SHA of the published images to deploy (defaults to latest main commit)"
        required: false
        default: ""

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ap-south-1
      FRONTEND_REPO: moss-marrow/frontend
      BACKEND_REPO: moss-marrow/backend
      SSM_DOCUMENT: moss-marrow-deploy

    steps:
      - name: Resolve deployment SHA
        id: resolve-sha
        run: |
          if [ -n "${{ inputs.image_sha }}" ]; then
            echo "sha=${{ inputs.image_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1

      - name: Resolve frontend image digest
        id: frontend-digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --region "${{ env.AWS_REGION }}" \
            --repository-name "${{ env.FRONTEND_REPO }}" \
            --image-ids imageTag="${{ steps.resolve-sha.outputs.sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::Frontend image not found in ECR for SHA ${{ steps.resolve-sha.outputs.sha }}"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Frontend digest: $DIGEST"

      - name: Resolve backend image digest
        id: backend-digest
        run: |
          DIGEST=$(aws ecr describe-images \
            --region "${{ env.AWS_REGION }}" \
            --repository-name "${{ env.BACKEND_REPO }}" \
            --image-ids imageTag="${{ steps.resolve-sha.outputs.sha }}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          if [ -z "$DIGEST" ] || [ "$DIGEST" = "None" ]; then
            echo "::error::Backend image not found in ECR for SHA ${{ steps.resolve-sha.outputs.sha }}"
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Backend digest: $DIGEST"

      - name: Get EC2 instance ID
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${{ env.AWS_REGION }}" \
            --filters "Name=tag:Name,Values=moss-marrow-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::No running EC2 instance found with tag Name=moss-marrow-app"
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "EC2 Instance: $INSTANCE_ID"

      - name: Send SSM deployment command
        id: ssm-send
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --document-name "${{ env.SSM_DOCUMENT }}" \
            --instance-ids "${{ steps.instance.outputs.instance_id }}" \
            --parameters "frontendDigest=${{ steps.frontend-digest.outputs.digest }},backendDigest=${{ steps.backend-digest.outputs.digest }}" \
            --timeout-seconds 300 \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM Command ID: $COMMAND_ID"

      - name: Poll SSM command status
        run: |
          COMMAND_ID="${{ steps.ssm-send.outputs.command_id }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          DELAY=5
          MAX_DELAY=30
          DEADLINE=$((SECONDS + 600))  # 10-minute overall timeout

          echo "Polling SSM command ${COMMAND_ID}..."

          while true; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "::error::SSM command timed out after 10 minutes"
              exit 1
            fi

            RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '[Status, StatusDetails]' \
              --output text 2>&1) || {
              ERROR_MSG="$RESULT"
              if echo "$ERROR_MSG" | grep -q "InvocationDoesNotExist"; then
                echo "  Invocation not yet available — waiting ${DELAY}s..."
                sleep "$DELAY"
                DELAY=$(( DELAY * 2 > MAX_DELAY ? MAX_DELAY : DELAY * 2 ))
                continue
              else
                echo "::error::SSM API error: $ERROR_MSG"
                exit 1
              fi
            }

            STATUS=$(echo "$RESULT" | awk '{print $1}')
            DETAILS=$(echo "$RESULT" | awk '{print $2}')

            echo "  Status: $STATUS ($DETAILS)"

            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|TimedOut|Cancelled|Undeliverable|Terminated|AccessDenied|DeliveryTimedOut|ExecutionTimedOut)
                echo "::error::SSM command failed with status: $STATUS ($DETAILS)"
                # Print command output for debugging
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text 2>/dev/null || true
                echo "--- STDERR ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text 2>/dev/null || true
                exit 1
                ;;
              InProgress|Pending|Delayed)
                sleep "$DELAY"
                DELAY=$(( DELAY * 2 > MAX_DELAY ? MAX_DELAY : DELAY * 2 ))
                ;;
              *)
                echo "::warning::Unknown status: $STATUS — continuing to poll"
                sleep "$DELAY"
                ;;
            esac
          done

      - name: Publish deployment summary
        if: always()
        run: |
          echo "## 🚀 EC2 Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit SHA** | \`${{ steps.resolve-sha.outputs.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Instance** | \`${{ steps.instance.outputs.instance_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Frontend Digest** | \`${{ steps.frontend-digest.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Backend Digest** | \`${{ steps.backend-digest.outputs.digest }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **SSM Command** | \`${{ steps.ssm-send.outputs.command_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Deployment pipeline completed." >> "$GITHUB_STEP_SUMMARY"
