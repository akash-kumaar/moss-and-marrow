# =============================================================================
# MOSS & MARROW — CodeQL Static Analysis
# =============================================================================
# GitHub's CodeQL performs semantic static analysis to detect security
# vulnerabilities at the source code level.
#
# Language: javascript-typescript covers both JavaScript (frontend/backend)
# and TypeScript if added in future.
#
# This workflow uses the standard GitHub security-events permission pattern.
# It does NOT receive AWS or deployment secrets.
# =============================================================================

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sunday at 03:00 UTC (independent of commit cadence).
    - cron: "0 3 * * 0"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis — JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write  # Required to upload results to GitHub Security
      actions: read           # Required to access workflow artifacts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          languages: javascript-typescript
          # Use the security-extended query suite for broader vulnerability coverage.
          queries: security-extended

      - name: Autobuild
        # For JavaScript/TypeScript, autobuild performs no compilation.
        # This step is included for consistency and future language additions.
        uses: github/codeql-action/autobuild@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          category: "/language:javascript-typescript"

