limit_conn_zone $binary_remote_addr zone=api_clients:1m;
log_format api_json escape=json '{"event":"edge_request","ip":"$remote_addr","method":"$request_method","status":$status,"duration":$request_time}';

# Generated on the EC2 host only after a trusted IP certificate is issued.
# The image ships an empty version so Nginx can start before first issuance.
include /etc/nginx/moss-tls/https-server.conf;

server {
    listen 80;
    server_name 13.204.246.90 localhost;

    # Root directory for static frontend files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for text and asset types
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # HTTP-01 challenge remains available while all normal traffic is redirected.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        access_log off;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/moss-routes.conf;
}

