limit_conn_zone $binary_remote_addr zone=api_clients:1m;
log_format api_json escape=json '{"event":"edge_request","ip":"$remote_addr","method":"$request_method","status":$status,"duration":$request_time}';

server {
    listen 80;
    server_name localhost;

    # Root directory for static frontend files
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for text and asset types
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Proxy API requests to Express backend container
    location ^~ /api/ {
        access_log /var/log/nginx/access.log api_json;
        limit_conn api_clients 32;
        limit_conn_status 429;
        error_page 429 = @api_busy;
        client_max_body_size 16k;
        client_body_timeout 15s;
        proxy_connect_timeout 5s;
        proxy_read_timeout 25s;
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location @api_busy {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"message":"Too many concurrent requests."}';
    }

    # Static assets caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 50x error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

