# Shared application routes for the HTTP and HTTPS virtual hosts.
location ^~ /api/ {
    include /etc/nginx/moss-tls/https-redirect.conf;
    access_log /var/log/nginx/access.log api_json;
    limit_conn api_clients 32;
    limit_conn_status 429;
    error_page 429 = @api_busy;
    client_max_body_size 16k;
    client_body_timeout 15s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
}

location @api_busy {
    default_type application/json;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Retry-After 1 always;
    return 429 '{"message":"Too many concurrent requests."}';
}

location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|eot|ttf|otf)$ {
    include /etc/nginx/moss-tls/https-redirect.conf;
    expires 6M;
    access_log off;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Cache-Control "public, max-age=15552000, immutable";
    try_files $uri =404;
}

location / {
    include /etc/nginx/moss-tls/https-redirect.conf;
    try_files $uri $uri/ /index.html;
}

error_page 500 502 503 504 /50x.html;
location = /50x.html {
    include /etc/nginx/moss-tls/https-redirect.conf;
    root /usr/share/nginx/html;
}
