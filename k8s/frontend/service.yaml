# =============================================================================
# Frontend Service — MOSS & MARROW
# =============================================================================
# Exposes the frontend Nginx reverse proxy to the internet via an AWS Load Balancer.
# Traffic Flow: User -> AWS ELB (Port 80) -> Nginx Pod (Port 80) -> Express API (Port 5000)
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: moss-marrow-frontend
  namespace: moss-marrow
  labels:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
