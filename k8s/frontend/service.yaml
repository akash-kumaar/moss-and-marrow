apiVersion: v1
kind: Service
metadata:
  name: moss-marrow-frontend
  namespace: moss-marrow
  labels:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: frontend
spec:
  # LoadBalancer exposes the frontend to the internet via an AWS ELB.
  # For cost savings during development, use ClusterIP and port-forward instead.
  # To switch: change type to ClusterIP and remove the port: 80 line.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

