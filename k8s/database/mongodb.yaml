# =============================================================================
# MongoDB In-Cluster Database (Development / Portfolio Alternative)
# =============================================================================
# Recommended Production: MongoDB Atlas M0 (Free Tier, no cluster maintenance).
# Use this in-cluster manifest if you prefer running MongoDB directly inside EKS
# without external dependencies.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: moss-marrow
  labels:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: database
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: moss-marrow
  labels:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: database
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: moss-marrow
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: moss-marrow
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - name: mongodb
              containerPort: 27017
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: MONGO_INITDB_DATABASE
              value: "moss_and_marrow"
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: mongo-data
          emptyDir: {}
