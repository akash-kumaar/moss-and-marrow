apiVersion: v1
kind: Service
metadata:
  name: moss-marrow-backend
  namespace: moss-marrow
  labels:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: backend
spec:
  # ClusterIP: backend is NOT exposed publicly.
  # The frontend Nginx container proxies /api/ to this service within the cluster.
  # In Kubernetes, Nginx cannot use the Docker Compose hostname "backend".
  # Instead, it must reference the Kubernetes service by DNS:
  #   http://moss-marrow-backend.moss-marrow.svc.cluster.local:5000
  # Update nginx.conf proxy_pass if deploying to Kubernetes.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: backend
  ports:
    - name: api
      port: 5000
      targetPort: 5000
      protocol: TCP

