# =============================================================================
# Backend Service — MOSS & MARROW
# =============================================================================
# ClusterIP: Internal-only service. Backend is NOT exposed publicly.
# Provides DNS name "backend" and "moss-marrow-backend" within namespace moss-marrow
# so frontend Nginx proxy_pass (http://backend:5000) resolves automatically.
# =============================================================================

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: moss-marrow
  labels:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: backend
  ports:
    - name: api
      port: 5000
      targetPort: 5000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: moss-marrow-backend
  namespace: moss-marrow
  labels:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: moss-marrow
    app.kubernetes.io/component: backend
  ports:
    - name: api
      port: 5000
      targetPort: 5000
      protocol: TCP
